name: Sync booking calendars

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge private calendar feeds
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
          BOOKING_ICAL_URL: ${{ secrets.BOOKING_ICAL_URL }}
          VRBO_ICAL_URL: ${{ secrets.VRBO_ICAL_URL }}
        run: python scripts/sync_calendars.py
      - name: Publish updated availability
        run: |
          if git diff --quiet -- data/availability.json; then
            exit 0
          fi
          git config user.name "Villa Tullia calendar sync"
          git config user.email "calendar-sync@users.noreply.github.com"
          git add data/availability.json
          git commit -m "chore: sync booking availability"
          git push
